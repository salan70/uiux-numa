<style>

:root{

:root[data-theme="dark"]{--bg:#1A1B1B;--panel:#252726;--fg:#F0F0F0;--muted:#C9C9C9;--edge:#8B9C91;--soft:#323433;--row:#2C2E2D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:24px 64px}
main{max-width:1080px;margin:0 auto;display:grid;gap:44px}
h1{font-size:28px;line-height:1.3;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:21px;line-height:1.3;margin:0 0 12px;font-weight:800}
h3{font-size:16px;margin:0;font-weight:800}
p{margin:0;max-width:68ch}
.lead{color:var(--muted);margin-top:8px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.eyebrow a{color:inherit}
.note{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:3px solid var(--edge);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.opts{display:grid;gap:20px}
.app{background:var(--a-bg);color:var(--a-ink);border-radius:10px;padding:16px;border:1px solid var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:18px 8px;justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center}
.cap{font-size:11px;line-height:1.35;text-align:center;color:var(--a-ink);margin-top:8px;max-width:76px;font-weight:700}
.tile{--s:64px;width:var(--s);height:var(--s);position:relative;display:grid;place-items:center;flex:none;border:2px solid var(--a-ink);border-radius:calc(var(--s)*.16);box-shadow:3px 3px 0 var(--a-ink)}
.tile svg{display:block}
.chip{position:absolute;right:-8px;bottom:-8px;font-weight:800;font-size:12px;line-height:1.35;padding:0 4px;border:2px solid var(--a-ink);border-radius:6px;background:var(--a-surface);color:var(--a-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.first{background:var(--a-coral)}
.chip.career{background:var(--a-yellow)}
.chip small{font-size:9px;margin-right:1px}
.stars{position:absolute;right:-8px;bottom:-8px;display:flex;gap:1px;padding:1px 3px;border:2px solid var(--a-ink);border-radius:6px;background:var(--a-surface)}
dl{margin:0;display:grid;gap:6px}
dt{font-weight:800;font-size:13px}
dd{margin:0;color:var(--muted);font-size:14px}
.pick{box-shadow:5px 5px 0 var(--edge)}
.tag{display:inline-block;font-size:12px;font-weight:800;border:2px solid var(--edge);border-radius:6px;padding:0 8px;margin-left:8px;vertical-align:2px;background:var(--a-yellow);color:#1F1F1F}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{border:2px solid var(--edge);border-radius:10px;padding:8px 14px;min-width:140px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px;line-height:1.5}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
thead th{font-size:12px;color:var(--muted);font-weight:700}
tbody tr.grp th{background:var(--row);font-weight:800;font-size:13px}
td code{font-size:11px;color:var(--muted)}
.new{display:inline-block;font-size:10px;font-weight:800;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px}
.motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px;font-size:13px}
.motifs div{border-bottom:1px solid var(--soft);padding:4px 0}

    <h2>3. 絵柄の一覧と比喩</h2>

</main>

const DIG={0:['111','101','101','101','111'],1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','001','010','010'],8:['111','101','111','101','111'],9:['111','101','111','001','111']};
function withDigits(name,num,fill){ // 16 × 16 の升目の右下に、3 × 5 の数字の札を描き込む
  const g=BADGE_GRIDS[name].map(r=>r.split(''));const ds=[...num];const w=ds.length*4+1,h=7;
  if(w>16)return null;const x0=16-w,y0=16-h;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const edge=y===0||y===h-1||x===0||x===w-1;g[y0+y][x0+x]=edge?'k':fill}
  ds.forEach((d,i)=>DIG[d].forEach((row,yy)=>[...row].forEach((b,xx)=>{if(b==='1')g[y0+1+yy][x0+2+i*4+xx]='k'})));
  return g.map(r=>r.join(''));
}

  return `<svg width="${px}" height="${px}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${o}</svg>`}

  cons:'実績ごとに 1 枚で 95 枚。16 × 16 では 3 桁が限界で、1,000 以上（通算安打、スコア 10,000）は入らない。数字の札が絵柄の 3 分の 1 を隠す。閾値が変わると描き直す。'},
 {id:'C',title:'C. 数の代わりに段階の星を重ねる',
  render:([lab,n,k,st])=>k==='t'?TITLE():tileOf(pixSvg('hr',48),undefined,`<span class="stars">${[1,2,3].map(i=>starSvg(i<=st)).join('')}</span>`),
  pros:'桁数に左右されず、段階の上下が一目でわかる。',

document.getElementById('opts').innerHTML=OPTS.map(o=>`<article class="card${o.pick?' pick':''}"><h3>${o.title}${o.pick?'<span class="tag">推し</span>':''}</h3>
  <div class="app"><div class="grid">${HR.map(h=>`<div class="cell">${o.render(h)}<div class="cap">${h[0]}</div></div>`).join('')}</div></div>
  <dl><div><dt>よいところ</dt><dd>${o.pros}</dd></div><div><dt>弱いところ</dt><dd>${o.cons}</dd></div></dl></article>`).join('');

/* ---------- 2〜4. 体系 ---------- */
const all=G.flatMap(([g,rs])=>rs.map(r=>[g,...r]));
const used=new Set(all.map(r=>r[3]));
const badgeN=all.filter(r=>!r[0].includes('ショップ')).length,shopN=all.length-badgeN;
const haveN=[...used].filter(k=>M[k]?.[2]).length;
document.getElementById('stats').innerHTML=[[badgeN,'実績'],[shopN,'ショップ'],[used.size,'描く絵柄（A 案）'],[haveN,'原本があるもの'],[used.size-haveN,'これから描く']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
document.getElementById('motifs').innerHTML=[...used].map(k=>`<div><b>${M[k][0]}</b>：${M[k][1]}${M[k][2]?'':'<span class="new">新規</span>'} <code>${k}</code></div>`).join('');
document.getElementById('rows').innerHTML=G.map(([g,rs])=>`<tr class="grp"><th colspan="4">${g}（${rs.length}）</th></tr>`+rs.map(([n,id,m,x])=>`<tr><td>${n}</td><td><code>${id}</code></td><td>${M[m][0]}<code> ${m}</code></td><td>${x||'—'}</td></tr>`).join('')).join('');
