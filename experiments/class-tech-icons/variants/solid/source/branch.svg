<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="none">
  <title>バージョン管理</title>
  <!--
    Git のグラフ。主線の最初の commit の直下から枝が右へ分かれ、下って別の commit に至る。
    太さ 4、端点と角の半径 2。commit は棒より 1.5 太い円 (r=3.5) で、棒と一体の塊にする。
    round 2: 分岐点を y=11.5 から 10.5 へ上げた。中央で分かれると小文字の h に見えるため。
  -->
  <path id="part-branch-main" d="M5 5.5 L5 18.5 A2 2 0 0 0 9 18.5 L9 5.5 A2 2 0 0 0 5 5.5 Z"/>
  <path id="part-branch-fork" d="M7 12.5 L15 12.5 L15 18.5 A2 2 0 0 0 19 18.5 L19 10.5 A2 2 0 0 0 17 8.5 L7 8.5 A2 2 0 0 0 7 12.5 Z"/>
  <path id="part-branch-node-head" d="M3.5 5.5A3.5 3.5 0 0 1 10.5 5.5A3.5 3.5 0 0 1 3.5 5.5Z"/>
  <path id="part-branch-node-tail" d="M3.5 18.5A3.5 3.5 0 0 1 10.5 18.5A3.5 3.5 0 0 1 3.5 18.5Z"/>
  <path id="part-branch-node-side" d="M13.5 18.5A3.5 3.5 0 0 1 20.5 18.5A3.5 3.5 0 0 1 13.5 18.5Z"/>
</svg>
