<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="none">
  <title>ブラウザと Web</title>
  <!--
    地球儀。円の塗りを赤道 (幅 2) で上下に断ち、経線を同心楕円の差分 (幅 2) で抜く。
    切り抜きが重なると evenodd で塗りが戻るため、経線は赤道の上下で分けて 4 枚にする。
  -->
  <path id="part-web-globe" fill-rule="evenodd" d="M3.06 11A9 9 0 0 1 20.94 11Z M20.94 13A9 9 0 0 1 3.06 13Z M6.04 11A6 9 0 0 1 12 3A4 9 0 0 0 8.02 11Z M17.96 11A6 9 0 0 0 12 3A4 9 0 0 1 15.98 11Z M6.04 13A6 9 0 0 0 12 21A4 9 0 0 1 8.02 13Z M17.96 13A6 9 0 0 1 12 21A4 9 0 0 0 15.98 13Z"/>
</svg>
