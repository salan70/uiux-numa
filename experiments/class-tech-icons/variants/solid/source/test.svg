  <title>テスト</title>
  <!--
    検査票（クリップ付きの板）の塗りに、合格のチェックを幅 2 の負の空間で抜く。
    クリップは別の path にして、evenodd で板と打ち消し合わないようにする。
    round 2: 板を 14x15.5 から 13x14.5 に縮め、8 個の中で塗りが重く見えるのを抑えた。
