<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色、端点は round。melt 系の案で共通にする。 -->
  <!-- 骨格は nu-round と同じ。肩の半径 4（中心 (10,12)）、底の半径 6、共有する縦画は x 14。 -->
  <!-- 変えた点: 左の脚の端が溶けて玉になる。上の端は細いまま、下の端だけ重くして重力を示す。脚は y 20 で玉へ渡す。 -->
  <path id="part-mark-letter" d="M6 20V12a4 4 0 0 1 8 0v8a6 6 0 0 0 12 0V6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- 溶けた先: 左の脚の端に、字画 4 より太い直径 6 の玉をためる。半径 3、中心 (6,25) で底 28 に合わせる。 -->
  <!-- 玉は x 3 まで出て live area を 1 越える。丸い形の視覚補正（overshoot）として許す。脚から玉へは 3 次曲線で太らせる。 -->
  <path id="part-mark-bulb" d="M4 19C4 22 3 23 3 25a3 3 0 0 0 6 0c0-2-1-3-1-6Z" fill="currentColor"/>
</svg>
