<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、線幅 2、単色。4 案で共通にする。 -->
  <!-- 波紋: 隙間を 3 = 12 / 4 で一定にする。等速で広がる波面の間隔が一定であることに対応する。 -->
  <!-- 外側から: 輪 10..12（r=11）、隙間 3、輪 5..7（r=6）、隙間 3、滴 0..2（r=2）。半径 12 が live area の内接円。 -->
  <!-- 16px（1/2 倍）では隙間が 1.5px 残る。前案の等比 1/2（12, 6, 3）は隙間が 1px になり潰れた。 -->
  <!-- 外輪: 270 度だけ描き、右下の 90 度を開ける。波紋が枠の外へ続くことを示し、対称軸を消す。 -->
  <path id="part-mark-outer" d="M16 27 A11 11 0 1 1 27 16" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle id="part-mark-inner" cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- 滴: 波紋の中心。 -->
  <circle id="part-mark-drop" cx="16" cy="16" r="2" fill="currentColor"/>
</svg>
