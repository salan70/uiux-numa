<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。5 案で共通にする。 -->
  <!-- 小文字 n: 脚の中心は x 10 と 20、肩の半径 5。天は 11 − 5 − 2 = 4。中心 15 で、沼の中心 16 から 1 左へずらす。 -->
  <!-- 脚は y 20 で切り、隙間 2 を水面にする。 -->
  <path id="part-mark-letter" d="M10 20V11a5 5 0 0 1 10 0v9" fill="none" stroke="currentColor" stroke-width="4"/>
  <!-- 沼: 丈 6 = 24 / 4、両端は半径 3 の半円で live area の幅 4..28 に広げる。 -->
  <!-- 水面下の脚: 沼を脚の幅で深さ 3（丈の半分）だけ抜き、脚が水の中へ続くことを示す。 -->
  <path id="part-mark-pond" d="M7 22h18a3 3 0 0 1 0 6H7a3 3 0 0 1 0-6Z M8 22v3h4v-3Z M18 22v3h4v-3Z" fill="currentColor" fill-rule="evenodd"/>
</svg>
