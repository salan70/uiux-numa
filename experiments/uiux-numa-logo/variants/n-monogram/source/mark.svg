<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。5 案で共通にする。 -->
  <!-- 字画 4 = 24 / 6。16px（1/2 倍）で 2px になり、字として読める太さを保つ。 -->
  <!-- 縦画: 左は y 8..28、右は y 4..24。字画 1 本分の 4 だけ上下にずらし、N の点対称を崩す。 -->
  <!-- 斜画: 左上 (4,8) から右下 (28,24) へ。横幅 6 で、垂直な太さ 6 × 16 / √(18² + 16²) = 3.986 ≈ 4 になる。 -->
  <path id="part-mark-letter" d="M4 8h4v20H4Z M24 4h4v20h-4Z M4 8h6l18 16h-6Z" fill="currentColor"/>
</svg>
