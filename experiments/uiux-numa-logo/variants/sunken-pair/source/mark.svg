<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、線幅 2、単色。4 案で共通にする。 -->
  <!-- 水面 y = 14。water-line と同じ √2 分割を使う。 -->
  <!-- 2 本の柱: 幅 8 と 10、隙間 6。8 + 6 + 10 = 24 が live area の幅に一致する。 -->
  <!-- 露出部は幅と同じ丈の正方形にする（8 角と 10 角）。沈下量は 6 と 12 の等比 1:2 にする。 -->
  <!-- 沈んだ側: 水面下は塗りで、水の中にあることを示す。 -->
  <path id="part-mark-below" d="M4 14h8v6H4Z M18 14h10v12H18Z" fill="currentColor"/>
  <!-- 出ている側: 水面上は輪郭だけにする。塗りと輪郭の境界が水面を示す（LOGO-08 の負の空間）。 -->
  <path id="part-mark-above" d="M5 14V7h6v7 M19 14V5h8v9" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- 水面線: 2 本の柱の隙間 12..18 だけを引き、水面を柱の間でつなぐ。 -->
  <path id="part-mark-waterline" d="M12 14h6" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>
