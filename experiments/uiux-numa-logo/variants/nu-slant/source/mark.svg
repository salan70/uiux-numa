<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。nu 系の案で共通にする。 -->
  <!-- 骨格は nu-arches と同じ。肩の半径 4（中心 (10,12)）、底の半径 6（中心 (20,20)）、共有する縦画は x 14 の y 12..20。 -->
  <!-- 変えた軸: 端点。字画の輪郭を面で描き、両端を 45° で切る。切り口の横幅は字画 4 で、2 つの切り口は平行にそろえる。 -->
  <!-- 左の脚は外側 x 4 が底 28 まで、内側 x 8 が 24 まで。右の脚は外側 x 28 が天 4 まで、内側 x 24 が 8 まで。 -->
  <path id="part-mark-letter" d="M4 28V12a6 6 0 0 1 12 0v8a4 4 0 0 0 8 0V8l4-4v16a8 8 0 0 1-16 0v-8a2 2 0 0 0-4 0v12Z" fill="currentColor"/>
</svg>
