<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。5 案で共通にする。 -->
  <!-- U: 底の半径 9、中心 (16,17)。底の外縁は 17 + 9 + 2 = 28。 -->
  <!-- 左の脚は天 4 まで、右の脚は 24 / 3 = 8 短く y 12 で止める。UI/UX と NUMA に共通する U を顔にする。 -->
  <path id="part-mark-letter" d="M7 4v13a9 9 0 0 0 18 0v-5" fill="none" stroke="currentColor" stroke-width="4"/>
  <!-- 窪地の水: 底の中心線 y 17 から下を塗る。半径は内縁 7 ではなく 8 にし、字画へ 1 重ねて境目の髪線を消す。 -->
  <path id="part-mark-water" d="M8 17h16a8 8 0 0 1-16 0Z" fill="currentColor"/>
  <!-- 泡: 半径 2、水面から隙間 3 で浮かべる（17 − 3 − 2 = 12）。中心から 2 左へずらし、対称軸を消す。 -->
  <circle id="part-mark-bubble" cx="14" cy="12" r="2" fill="currentColor"/>
</svg>
