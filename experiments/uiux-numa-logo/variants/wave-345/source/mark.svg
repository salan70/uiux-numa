<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、線幅 2、単色。4 案で共通にする。 -->
  <!-- さざ波: 半円 3 個を上下交互につなぐ。半径は 3, 4, 5 のピタゴラス数。 -->
  <!-- 直径の和 6 + 8 + 10 = 24 が live area の幅にちょうど一致する。半径が違うので対称軸を持たない。 -->
  <!-- 水: 中心線 y = 16 の波から底 28 まで。 -->
  <path id="part-mark-water" d="M4 16 a3 3 0 0 1 6 0 a4 4 0 0 0 8 0 a5 5 0 0 1 10 0 V28 H4 Z" fill="currentColor"/>
  <!-- さざ波の線: 同じ波を 6 = 24 / 4 だけ上へ平行移動する。合同な写しなので波形が一致する。 -->
  <path id="part-mark-ripple" d="M4 10 a3 3 0 0 1 6 0 a4 4 0 0 0 8 0 a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>
