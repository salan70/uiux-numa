<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。 -->
  <!-- 小文字 n と u は互いの 180° 回転である。∩ と ∪ を 1 本の線でつなぎ、NUMA の字の律動にする。 -->
  <!-- 肩の半径 4（中心 (10,12)）、底の半径 6（中心 (20,20)）。直径の和 8 + 12 = 20 が中心線の幅 24 − 4 に一致する。 -->
  <!-- 半径が違うので点対称にならない。共有する縦画は x 14 の y 12..20。 -->
  <!-- 端点は round。round cap は端から字画の半分 2 だけ伸びるので、両端を 26 と 6 に置き、外縁を 28 と 4 に保つ。 -->
  <path id="part-mark-letter" d="M6 26V12a4 4 0 0 1 8 0v8a6 6 0 0 0 12 0V6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
