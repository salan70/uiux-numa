<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子。面の外縁を偶数座標に置くと、16px（1/2 倍）で整数ピクセルに乗る。 -->
  <!-- live area は 4..28。3 案で共通にする。 -->
  <!-- 1 つの面 4..28 x 4..28 を、(12,4)-(18,28) の対角で割る。割れ目の幅は 4。 -->
  <!-- 左の片: 上辺 8、下辺 14 の台形。 -->
  <path id="part-mark-left" d="M4 4h8l6 24H4Z" fill="currentColor"/>
  <!-- 右の片: 上辺 12、下辺 6 の台形。左右の面積を揃えず、割れ目を負の空間として読ませる（LOGO-08）。 -->
  <path id="part-mark-right" d="M16 4h12v24h-6Z" fill="currentColor"/>
</svg>
