<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色、端点は round。melt 系の案で共通にする。 -->
  <!-- 骨格は nu-round と同じ。肩の半径 4（中心 (10,12)）、底の半径 6、共有する縦画は x 14。 -->
  <!-- 変えた点: u の底から滴が 1 つ垂れる。共有する縦画を 2 縮め（y 12..18）、底の外縁を 26 に上げて滴の場所を空ける。 -->
  <path id="part-mark-letter" d="M6 26V12a4 4 0 0 1 8 0v6a6 6 0 0 0 12 0V6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- 滴: 底の中心 x 20 から 1.5 右へずらした x 21.5 に、半径 1.5 の玉で垂らす。底 28 に合わせる。 -->
  <!-- 中心に置いた版は u が Y に読めたので、小さくし右へ寄せた。 -->
  <path id="part-mark-drip" d="M21 25c0 1-1 1.5-1 2a1.5 1.5 0 0 0 3 0c0-.5-1-1-1-2Z" fill="currentColor"/>
</svg>
