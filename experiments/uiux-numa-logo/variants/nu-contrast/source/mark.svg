<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>UI/UX NUMA</title>
  <!-- 組の規則: 32 の格子、live area は 4..28（24 角）、字画 4、単色。nu 系の案で共通にする。 -->
  <!-- 骨格は nu-arches と同じ。肩の半径 4（中心 (10,12)）、底の半径 6（中心 (20,20)）、共有する縦画は x 14 の y 12..20。 -->
  <!-- 変えた軸: 字画の強弱。縦画は 4 のまま、肩と底の頂点だけ字画の半分 2 に細める。 -->
  <!-- 内側の弧を楕円にする。n の内側は横半径 2・縦半径 4 で頂点 y 8、u の内側は横半径 4・縦半径 6 で頂点 y 26。 -->
  <path id="part-mark-letter" d="M4 28V12a6 6 0 0 1 12 0v8a4 6 0 0 0 8 0V4h4v16a8 8 0 0 1-16 0v-8a2 4 0 0 0-4 0v16Z" fill="currentColor"/>
</svg>
