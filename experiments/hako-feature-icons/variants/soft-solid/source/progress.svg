<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="none">
  <title>進み具合を見る</title>
  <!--
    円グラフのシルエット。塗りが完了した分、右上の欠けた約 90° が残りの分。欠けは負の空間で、閉合により円全体として読める。
    半径は円の keyline 20 より小さい 8.25。塗りの面積を人物と鐘（160 前後）に揃えるため。
    欠けの 2 つの外の角は r=2、頂点の内の角は r=1。接点の座標は円周上にあるため格子には乗らない。
    round 2: 中心を (12,12) から (12.5,11.5) へ動かした。塗りの重心が左下に寄るのを補う。
    round 3: 欠けの 2 辺を x=13 と y=11 の整数の線に置いた（24px で辺がにじまない）。頂点が中心から 0.5 ずれて欠けが狭まる分、半径を 8.5 から 8.25 に落として面積を戻した。
  -->
  <path id="part-progress-pie" d="M13 5.43L13 10A1 1 0 0 0 14 11L18.57 11A2 2 0 0 1 20.51 13.48A8.25 8.25 0 1 1 10.52 3.49A2 2 0 0 1 13 5.43Z"/>
</svg>
