<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="none">
  <title>担当を決める</title>
  <!--
    人物のシルエット（頭 + 肩）に、右の塗りのチェックで「1 人に決まった」を示す。
    線は使わず、頭と肩の間の隙間 2、頭とチェックの隙間 2 以上を負の空間として残す。
    肩は幅 12、上の角 r=5（肩の丸み）、下の角 r=2（外形の角丸の規則）。
    チェックは 45° の腕を太さ 2√2 で描き、頂点が整数か 0.5 の格子に乗るようにした。端は半円、外の角 r≈1.4、内の角 r≈0.7。
    round 2: 肩を 13 から 12 に狭め、チェックを頭の高さから首の高さ（y 8..13.5）へ下げた。右側の中段を埋め、見た目の中心を中央へ寄せる。
  -->
  <circle id="part-assign-head" cx="9" cy="7" r="4"/>
  <path id="part-assign-body" d="M8 13H10A5 5 0 0 1 15 18V19A2 2 0 0 1 13 21H5A2 2 0 0 1 3 19V18A5 5 0 0 1 8 13Z"/>
  <path id="part-assign-check" d="M15 10.5A1.41 1.41 0 0 1 17 8.5L17.5 9A0.71 0.71 0 0 0 18.5 9L19.5 8A1.41 1.41 0 0 1 21.5 10L19 12.5A1.41 1.41 0 0 1 17 12.5Z"/>
</svg>
