<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>担当を決める</title>
  <!-- 組の規則: 線は器（文脈）、塗りは決まったもの。ここでは線がタスクのカード、塗りが決まった担当者 1 人。 -->
  <!-- 線の中心は 0.75 + 1.5n に置く。16px（2/3 倍）で 1px の線がピクセルに乗る。外形は 3〜21 の 18 角。 -->
  <!-- カードは右下を開け、担当者との間に 1.5 以上の隙間を残す。枠を閉じなくてもカードに見える（閉合）。 -->
  <path id="part-assign-card" d="M11.25 15.75H6A2.25 2.25 0 0 1 3.75 13.5V6A2.25 2.25 0 0 1 6 3.75H15A2.25 2.25 0 0 1 17.25 6V6.75" fill="none" stroke="currentColor"/>
  <!-- タスクの題名 1 行。空の枠（切り抜きや画面）と区別する最小限の細部。左辺の内側から 2.25 離し、16px で癒着させない。 -->
  <path id="part-assign-title" d="M7.5 8.25H11.25" fill="none" stroke="currentColor"/>
  <!-- 担当者。カードの右下の角にアバターとして載る。頭は半径 3 で、16px で 4px の円として整数ピクセルに乗る。肩は 6px。 -->
  <circle id="part-assign-head" cx="16.5" cy="12" r="3" fill="currentColor" stroke="none"/>
  <path id="part-assign-body" d="M12 21a4.5 4.5 0 0 1 9 0Z" fill="currentColor" stroke="none"/>
</svg>
