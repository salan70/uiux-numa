<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>進み具合を見る</title>
  <!-- 組の規則: 線は器（文脈）、塗りは決まったもの。ここでは線が 100% の到達線、塗りが週ごとの完了分。 -->
  <!-- 台の線ではなく到達線を置き、件数ではなく「率」を示す。棒は 3 週分。 -->
  <!-- 到達線と棒の両端を 3〜21 に揃え、線が棒の基準だと分かるようにする。 -->
  <path id="part-progress-goal" d="M3.75 3.75H20.25" fill="none" stroke="currentColor"/>
  <!-- 棒の幅 3、間隔 4.5。16px で 2px の棒が左右対称に整数ピクセルへ乗る。高さ 6、10.5、13.5 は等間隔を避け、電波表示と区別する。 -->
  <path id="part-progress-week-1" d="M3 21V16.5a1.5 1.5 0 0 1 3 0V21Z" fill="currentColor" stroke="none"/>
  <path id="part-progress-week-2" d="M10.5 21V12a1.5 1.5 0 0 1 3 0V21Z" fill="currentColor" stroke="none"/>
  <path id="part-progress-week-3" d="M18 21V9a1.5 1.5 0 0 1 3 0V21Z" fill="currentColor" stroke="none"/>
</svg>
