<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>期限を知らせる</title>
  <!-- 比喩は with-skill と同じ「鐘と舌」。語彙は線画 1 つ、線幅 2、端点と角は root で 1 回、live area は padding 2、座標は整数だけ。 -->
  <!-- 胴は半円の頭、垂直の側面、裾の直線、縁の水平線だけで組む。縁を live area いっぱいの 3〜21 に置き、ink の幅を 20 に揃える。 -->
  <path id="part-deadline-body" d="M3 15l3-2V9a6 6 0 0 1 12 0v4l3 2Z"/>
  <!-- 舌。縁の ink から 2 離した半円で、ink の下端を 22 に合わせる。 -->
  <path id="part-deadline-clapper" d="M10 19a2 2 0 0 0 4 0"/>
</svg>
