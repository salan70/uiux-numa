<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>明暗：日と月、light</title>
  <!-- 円は比例で R/2=4.5 と決め、0.75 格子へ丸めた値も 4.5 のままなので誤差は 0。 -->
  <circle id="part-appearance-light-core" cx="12" cy="12" r="4.5" />
  <!-- 軸平行の光線は中心から 8.25 の keyline と 6.75 の内側端を比例で決め、0.75 格子へ丸めて 3.75..5.25 と 18.75..20.25 を採る。丸め誤差は 0。斜め光線は 8.25/sqrt(2)=5.834 を比例で求め、端点を 6.17/7.23 へ丸めた誤差 ±0.004 を残す。 -->
  <path id="part-appearance-light-rays" d="M12 3.75V5.25M12 18.75V20.25M3.75 12H5.25M18.75 12H20.25M6.17 6.17L7.23 7.23M16.77 16.77L17.83 17.83M17.83 6.17L16.77 7.23M7.23 16.77L6.17 17.83" />
</svg>
