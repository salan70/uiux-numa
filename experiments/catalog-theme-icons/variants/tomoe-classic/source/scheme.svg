<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>配色：三つ巴・古典作図</title>
  <!-- 曲線が主役なので 0.75 格子へは寄せず、作図式から求めた値を小数第3位で丸める。 -->
  <!-- O=(12,12)、R=8.25、rho=R/2=4.125。弦 OP=R=2rho なので、半径 rho の半円を内側の境界に採る。 -->
  <path id="part-scheme-primary" d="M12 3.75A8.25 8.25 0 0 1 19.145 16.125A4.125 4.125 0 0 1 12 12A4.125 4.125 0 0 0 12 3.75Z" />
  <!-- 曲線が主役なので 0.75 格子へは寄せず、作図式から求めた値を小数第3位で丸める。 -->
  <!-- 120度対称の次の外周点を P1=(19.145,16.125) から P2=(4.855,16.125) へ移し、同じ rho=4.125 の半円を共有する。 -->
  <path id="part-scheme-secondary" d="M19.145 16.125A8.25 8.25 0 0 1 4.855 16.125A4.125 4.125 0 0 1 12 12A4.125 4.125 0 0 0 19.145 16.125Z" />
  <!-- 曲線が主役なので 0.75 格子へは寄せず、作図式から求めた値を小数第3位で丸める。 -->
  <!-- 120度対称の最後の外周弧を P2=(4.855,16.125) から P0=(12,3.75) へ戻し、弦 OP=R=2rho の半円で閉じる。 -->
  <path id="part-scheme-tertiary" d="M4.855 16.125A8.25 8.25 0 0 1 12 3.75A4.125 4.125 0 0 1 12 12A4.125 4.125 0 0 0 4.855 16.125Z" />
</svg>
