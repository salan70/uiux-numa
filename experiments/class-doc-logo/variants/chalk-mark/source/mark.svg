<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" role="img">
  <title>授業資料</title>
  <!--
    印と進み。理解に付く印（チェック）を 1 本の筆致として面で描き、
    進む向き（左下から右上）へ太らせる。垂直の切れ目で 2 つに割り、
    小さい印 → 大きく伸びる、の順で「回を追って進む」を負の空間に読ませる（LOGO-08、FORM-10）。
    抽象記号なので何のサイトかは示せない。lockup（マーク + 「授業資料」）を基本形にして補う（LOGO-02、LOGO-05）。

    作図（すべて直線。曲線を使わない）
    - 外縁（左下側）: (10 29) -> (28 8)。傾き -7/6。短い腕は (10 29) -> (4 15)、傾き 7/3
    - 内縁（右上側）: (22 3) -> (11 21) の延長。傾き -18/11。短い腕の内縁は (7.5 13.5) から平行に下り、
      切り欠きの頂点 N(10.83 21.28) で内縁と交わる
    - 先端の切り口 (28 8) -> (22 3) は腕にほぼ直交。幅は短い腕 3.8、長い腕の根元 4.8、先端 7.8
    - 切れ目は x=13 と x=16 の垂直面。幅 3（16px で 1.5px。ICON-08 の最小に一致）。
      垂直にしたのは、斜めに切るより小サイズで縁が締まるため（SVG-01、ICON-09）。
      32px では両面ともピクセル境界に乗る。16px では x=13 側が半ピクセルになる
    - live area は上下 3、左右 4。縦長の形なので左右に余りを残す（FORM-05）
  -->
  <path id="part-mark-tick" d="M4 15 10 29 13 25.5 13 17.73 10.83 21.28 7.5 13.5Z"/>
  <path id="part-mark-rise" d="M16 22 28 8 22 3 16 12.82Z"/>
</svg>
