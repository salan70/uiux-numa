<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round">
  <title>授業資料</title>
  <!--
    class の頭文字 C を、字形をなぞらず角の取れた四角の骨格で組み直した記号。
    live area は 2..30（padding 2）。線幅 6、端点は butt（角丸の外形で柔らかさは取り、切り口は直角に残す）。
    中心線は 5..27 の角丸矩形（角の半径 7、外 10 / 内 4）で、右辺を y=12..20 で断つ。
    腕の先は角の弧の終端で切れるため内側を向き、口（8）は内側の面（16）の半分に収まる。
    負の空間は 16x16 の面と右へ抜ける 6x8 の溝になり、資料の一枚と、そこから引き出す動きとして読める。
    座標はすべて偶数に置き、16 / 32 / 64px で外縁と口がピクセル境界に乗る。
  -->
  <path id="part-mark-bowl" d="M27 12A7 7 0 0 0 20 5H12A7 7 0 0 0 5 12V20A7 7 0 0 0 12 27H20A7 7 0 0 0 27 20"/>
</svg>
