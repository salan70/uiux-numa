<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" role="img">
  <title>授業資料</title>
  <!--
    学ぶ行為の道具として、開いた本を正面から面で描く。
    既製の book アイコン（左右対称の見開きに中央の縦線）を避け、固有性を 2 つで作る。
    1. 非対称: 左ページの上辺は寝かせ（(4,10)->(13,14)、約 24 度）、右ページは立てる
       （(19,14)->(28,4)、約 48 度）。読み終えて伏せた側と、これから読む側の差。LOGO-03。
    2. 負の空間の谷: 背へ向かって細くなる楔でページの間を抜く。
       上端は (13,14)-(19,14) の幅 6、先端は (16,28) で 0。中央の縦線を引かずに見開きを示す。
       LOGO-08、FORM-10。16px では楔の下半分が閉じ、1 つの塊のシルエットになる。
    live area: x 4-28、y 4-28（24 x 24）。padding は四辺とも 4。
    16px のタブで他の favicon と並ぶため、live area を削らず塊の面積を優先する。
    外側の上角は尖らせてページの角にし、下角だけ角丸 2 にして綴じ側を示す。
    角丸 2 は採用済みの技術アイコン line-round の丸い端点と語彙を合わせる（ICON-07）。
    外辺 x=4 と x=28、下辺 y=28、楔の上端 y=14、頂点 y=4 は偶数に置く。
    16px（1 単位 = 0.5px）でピクセル境界に乗る（SVG-01、ICON-09）。
  -->
  <path id="part-mark-page-left" d="M4 10 13 14l3 14H6a2 2 0 0 1-2-2Z"/>
  <path id="part-mark-page-right" d="M19 14 28 4v22a2 2 0 0 1-2 2H16Z"/>
</svg>
