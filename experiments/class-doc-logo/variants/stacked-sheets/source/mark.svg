<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" role="img">
  <title>授業資料</title>
  <!--
    回を重ねて積み上がる資料。前の 1 枚を面で描き、後ろの 1 枚は負の空間で切り出した帯だけを見せる。
    座標はすべて偶数に置く。16px（1 単位 = 0.5px）で輪郭と隙間がピクセル境界に乗る（SVG-01、ICON-09）。
    前の紙 part-mark-front: x4-22、y8-30（18 x 22、縦長）。角丸 2。
    後ろの紙 part-mark-back: 同寸を (+6, -6) ずらし、前の紙を 2 太らせた形（角丸 4）で削った残り。
    残る帯は幅 4（16px で 2px）、隙間は 2（16px で 1px）。帯は右辺の途中（y24）で終わり、閉じた枠にしない。
    live area は上下 2、左右 4。solid の質量が左下に寄るため、帯のある右上に余白を残さない。
  -->
  <path id="part-mark-back" d="M12 2h14a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2h-2V10a4 4 0 0 0-4-4H10V4a2 2 0 0 1 2-2Z"/>
  <rect id="part-mark-front" x="4" y="8" width="18" height="22" rx="2"/>
</svg>
