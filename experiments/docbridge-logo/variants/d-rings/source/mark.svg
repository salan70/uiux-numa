<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>DocBridge</title>
  <!--
    d-arc の開口の中に半径 4 の半円を置き、同心の帯（12..8）と芯（4..0）にする。開口は幅 4 の弧の溝になる。
    溝の両端は半径 2 の半円で、その中心 (16 ∓ √32, 18) は d-arc の fillet と同じ点。8 − 2 = 4 + 2 なので、1 つの円が外弧、桁、芯の 3 つに接する。
    接点は外弧 (8.45, 17.33)、芯 (12.23, 18.67)。
  -->
  <path id="part-mark-letter" fill="currentColor" fill-rule="evenodd" d="M4 22V20A12 12 0 0 1 28 20V22A2 2 0 0 1 26 24H6A2 2 0 0 1 4 22ZM8.45 17.33A8 8 0 0 1 23.55 17.33A2 2 0 0 1 19.77 18.67A4 4 0 0 0 12.23 18.67A2 2 0 0 1 8.45 17.33Z"/>
</svg>
